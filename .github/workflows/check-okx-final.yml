
name: Check OKX Final

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test remaining OKX APIs
        shell: bash
        run: |
          test_api() {
            echo ""
            echo "=== $1 ==="
            curl -sS --max-time 20 \
              -o /tmp/response.json \
              -w "HTTP: %{http_code}\n" "$2"
            head -c 700 /tmp/response.json
            echo ""
          }

          test_api "5m Candles" \
            "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=5m&limit=10"

          test_api "Recent Trades" \
            "https://www.okx.com/api/v5/market/trades?instId=BTC-USDT-SWAP&limit=10"

          test_api "Funding Rate" \
            "https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP"

          test_api "Gate 5m Candles" \
            "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=BTC_USDT&interval=5m&limit=10"
