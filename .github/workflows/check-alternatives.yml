
name: Check Alternative Exchanges

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test futures APIs
        shell: bash
        run: |
          test_api() {
            echo ""
            echo "=== $1 ==="
            curl -sS --max-time 20 \
              -o /tmp/api-response.txt \
              -w "HTTP: %{http_code}\n" "$2"
            head -c 350 /tmp/api-response.txt
            echo ""
          }

          test_api "OKX Futures" \
            "https://www.okx.com/api/v5/market/tickers?instType=SWAP"

          test_api "OKX Open Interest" \
            "https://www.okx.com/api/v5/public/open-interest?instType=SWAP&instId=BTC-USDT-SWAP"

          test_api "Gate Futures" \
            "https://api.gateio.ws/api/v4/futures/usdt/tickers"

          test_api "Gate Open Interest" \
            "https://api.gateio.ws/api/v4/futures/usdt/contract_stats?contract=BTC_USDT&limit=2"
