
name: Check Binance Access

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test market endpoints
        shell: bash
        run: |
          echo "Testing Binance Futures..."
          curl -sS -L --max-time 15 \
            -o /tmp/futures.json \
            -w "Futures HTTP: %{http_code}\n" \
            "https://fapi.binance.com/fapi/v1/time"
          head -c 300 /tmp/futures.json || true
          echo ""

          echo "Testing Binance Futures market..."
          curl -sS -L --max-time 15 \
            -o /tmp/exchange.json \
            -w "Exchange HTTP: %{http_code}\n" \
            "https://fapi.binance.com/fapi/v1/exchangeInfo"
          head -c 200 /tmp/exchange.json || true
          echo ""

          echo "Testing Binance Spot..."
          curl -sS -L --max-time 15 \
            -o /tmp/spot.json \
            -w "Spot HTTP: %{http_code}\n" \
            "https://data-api.binance.vision/api/v3/time"
          cat /tmp/spot.json || true
          echo ""

          echo "Testing Bybit..."
          curl -sS -L --max-time 15 \
            -o /tmp/bybit.json \
            -w "Bybit HTTP: %{http_code}\n" \
            "https://api.bybit.com/v5/market/time"
          head -c 300 /tmp/bybit.json || true
          echo ""
