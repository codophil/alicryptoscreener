name: Altcoin Market Watcher V5
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'true: Telegram test | false: real scan | dry: scan without alerts'
        type: choice
        options: ['true', 'false', 'dry']
        default: 'true'
permissions:
  contents: write
concurrency:
  group: altcoin-watcher
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and tests
        run: |
          python -m py_compile watcher.py
          python -m unittest discover -s tests -v
      - name: Scan and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python watcher.py
      - name: Persist state
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.test_mode == 'false') }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update watcher state [skip ci]'
            git push
          fi
