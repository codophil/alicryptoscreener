name: Altcoin Radar

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send only a Telegram connection test?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: altcoin-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ inputs.test_mode == true }}
        run: python radar.py
      - name: Persist alert cooldowns
        if: success() && inputs.test_mode != true
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            git commit -m 'Update radar alert state [skip ci]'
            git push
          fi
